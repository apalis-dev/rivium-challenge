[package]
default-run = "taskping"
name = "taskping"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[lib]
# rlib for the laptop binaries, cdylib (libtaskping.so) for Android.
crate-type = ["rlib", "cdylib"]

[dependencies]
apalis = "=1.0.0"
apalis-sqlite = "=1.0.0"
futures = "0.3"
jni = { version = "=0.22.4", default-features = false }
rivium = { version = "=0.2.0", features = ["rt"] }
rivium-host = { version = "=0.2.0", features = ["process", "embedded"] }
rivium-jni = "=0.2.0"
serde = { version = "1", features = ["derive"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["sqlite"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
ulid = "1"
