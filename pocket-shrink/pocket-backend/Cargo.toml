[package]
name = "pocket-backend"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "pocket-cli"
path = "src/main.rs"

[dependencies]
rivium = { version = "0.2", features = ["rt"] }
rivium-host = { version = "0.2", features = ["process", "embedded"] }
rivium-jni = "0.2"
apalis = "1.0"
apalis-sqlite = "1.0"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
jni = "0.21"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"

[patch.crates-io]
rivium-util = { path = "patches/rivium-util" }
